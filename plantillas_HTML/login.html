{% extends "base.html" %}
{% block title %}Iniciar sesión{% endblock %}

{% block content %}

<div class="row justify-content-center mt-4">
    <div class="col-12 col-md-5">

        <div class="card shadow">

            <div class="card-body text-center">

                <!-- LOGO DEL NEGOCIO -->
                <div class="login-logo-container">
                    <img 
                        src="{{ url_for('static', filename='iconos/logo.jpg') }}" 
                        alt="Inversiones Génesis"
                        class="login-logo"
                    >
                </div>

                <!-- TÍTULO -->
                <h3 class="card-title text-center mb-4">
                    Iniciar sesión
                </h3>

                <!-- MENSAJE -->
                <p>
                    Por favor, escribe tu usuario y contraseña para iniciar sesión.
                </p>

                <!-- FORMULARIO -->
                <form method="POST">

                    <div class="mb-3 text-start">
                        <label class="form-label">
                            Usuario
                        </label>

                        <input 
                            type="text" 
                            name="usuario" 
                            class="form-control" 
                            required 
                            autofocus
                        >
                    </div>

                    <div class="mb-3 text-start">
                        <label class="form-label">
                            Contraseña
                        </label>

                        <input 
                            type="password" 
                            name="password" 
                            class="form-control" 
                            required
                        >
                    </div>

                    <button 
                        type="submit" 
                        class="btn btn-primary w-100"
                    >
                        Entrar
                    </button>

                </form>

            </div>

        </div>

    </div>
</div>

{% endblock %}
