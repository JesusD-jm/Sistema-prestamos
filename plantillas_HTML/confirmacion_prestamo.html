{% extends "base.html" %}
{% block title %}Préstamo realizado{% endblock %}

{% block content %}
<div class="d-flex justify-content-center align-items-center" style="min-height: 60vh;">
    <div class="card shadow-sm" style="max-width: 30rem; width: 100%;">
        <div class="card-body text-center">
            <h3 class="card-title mb-3">Préstamo realizado</h3>
            <p class="mb-4">
                El préstamo para <strong>{{ prestamo.cliente.nombre_completo }}</strong>
                se creó correctamente.
            </p>
            <a href="{{ url_for('prestamos.listar') }}" class="btn btn-primary">OK</a>
        </div>
    </div>
</div>
{% endblock %}
